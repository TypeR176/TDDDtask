[project]
name = "xiaoduo"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.136.3",
    "grandalf>=0.8",
    "langchain>=1.3.1",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.1",
    "loguru>=0.7.3",
    "modelscope>=1.37.1",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pymilvus[model]>=3.0.0",
    "pymilvus-model>=0.3.2",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.29",
    "regex>=2026.5.9",
    "uvicorn>=0.48.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "torchaudio>=2.5.0",
    "transformers>=4.47.0,<5.0.0",
    "flagembedding>=1.3.5",
    "torchaudio>=2.5.0",
    "kb>=0.1.8",
    "openai-agents>=0.4.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
torchaudio = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124/"
explicit = true
